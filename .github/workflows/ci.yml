name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate sources
        run: node scripts/validate.mjs
      - name: Tests
        run: node --test tests/
      - name: Generated plugin is up to date
        run: node bin/retro-port-kit.mjs build --check
